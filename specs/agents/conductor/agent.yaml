name: conductor
version: "1.0"
description: Operator front door. Talks with the operator, reads desk digests, fans questions out to project desks, and routes decisions to <operator>@external.

defaults:
  runtime: pi-tui

profiles:
  default:
    uses:
      skills: [openrig-workspace, seat-message, exec-brief]
      guidance: []
      subagents: []
      runtime_resources: []
      plugins: [openrig-core]

resources:
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
