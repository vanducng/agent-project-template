name: infra
version: "1.0"
description: Infrastructure specialist for IaC, AWS, cloud operations, access management, and CI/CD.

defaults:
  runtime: codex

profiles:
  default:
    uses:
      skills: [aws, devops, miudb, simplify, openrig-workspace]
      guidance: []
      subagents: []
      runtime_resources: []
      plugins: [openrig-core]

resources:
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
