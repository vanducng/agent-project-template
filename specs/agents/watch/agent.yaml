name: watch
version: "2.0"
description: Org watch collector seat (inbox, meetings, tickets). Writes one validated entry per event into the open day through kb append (ADR-0017, ADR-0021). Each seat reads roles/<member>.md.

defaults:
  runtime: pi-tui

profiles:
  default:
    uses:
      skills: [okf, seat-message, openrig-workspace]
      guidance: []
      subagents: []
      runtime_resources: []
      plugins: [openrig-core]

resources:
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
