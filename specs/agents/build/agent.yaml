name: build
version: "1.0"
description: "Builder (dev.build). The only writer in one worktree: implements a bounded queue item, runs the local gate and returns evidence."

defaults:
  runtime: codex

profiles:
  default:
    uses:
      skills: [simplify, ponytail, dbdesign, uiuxdesign, better-ui, design-eng, ship, openrig-workspace]
      guidance: []
      subagents: []
      runtime_resources: []
      plugins: [openrig-core]

resources:
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
