name: lead
version: "1.0"
description: "Task lead (orch.lead). Holds the intent and proof contract, routes work to seats, accepts results on evidence, closes the slice with a retro line."

defaults:
  runtime: codex

profiles:
  default:
    uses:
      skills: [intake, shape, ship, retro, openrig-workspace, seat-message]
      guidance: []
      subagents: []
      runtime_resources: []
      plugins: [openrig-core]

resources:
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: "openrig-home:plugins/openrig-core"

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
